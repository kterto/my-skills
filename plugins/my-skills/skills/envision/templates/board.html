}

  :root:not([data-theme="light"]) {
    --bg-page: #141312; --bg-surface: #1e1c1a; --bg-overlay: #272420;
    --text-primary: #f0ece6; --text-secondary: #b8b3ab; --text-muted: #7a7570;
    --accent: #818cf8; --accent-subtle: #1e1b4b; --accent-focus: #a5b4fc; --rule: #2e2b28; --rule-heavy: #3d3a36;
    --ok: #86efac; --ok-bg: #14532d; --active: #fcd34d; --active-bg: #451a03; --muted: #9ca3af; --muted-bg: #1f2937;
    --sk-bg: #1c1c1c; --sk-ink: #dddddd; --sk-accent: #bbbbbb;
  }
}
:root[data-theme="dark"] {
  --bg-page: #141312; --bg-surface: #1e1c1a; --bg-overlay: #272420;
  --text-primary: #f0ece6; --text-secondary: #b8b3ab; --text-muted: #7a7570;
  --accent: #818cf8; --accent-subtle: #1e1b4b; --accent-focus: #a5b4fc; --rule: #2e2b28; --rule-heavy: #3d3a36;
  --ok: #86efac; --ok-bg: #14532d; --active: #fcd34d; --active-bg: #451a03; --muted: #9ca3af; --muted-bg: #1f2937;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding: 0 16px; background: var(--bg-page); color: var(--text-primary); font: 1rem/1.65 var(--font-sans); overflow-wrap: anywhere; }

h1, h2 { font-family: var(--font-serif); font-weight: 600; line-height: 1.2; margin: 0; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.05rem; margin: 1rem 0 .25rem; }
p { margin: .4rem 0; }
a { color: var(--accent); }
.muted, .sum, cite { color: var(--text-muted); font-size: .875rem; font-style: normal; }
.meta, .chip, .badge, .pill, .lines { font-family: var(--font-mono); }

.pill::before { content: "\25CF  "; }
.pill.agreed { background: var(--ok-bg); color: var(--ok); }

.meta { font-size: .875rem; color: var(--text-secondary); }

.old { background: var(--active-bg); color: var(--active); padding: .5rem .75rem; border-radius: 6px; }

.btn[aria-pressed="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg-page); }

.sk-badge { width: auto; align-self: flex-start; border-radius: 999px; }
.sk-row > .sk-badge { flex: 0 0 auto; }
.swatch { display: inline-block; width: 2rem; height: 2rem; margin-right: .25rem; border: 1px solid var(--rule-heavy); border-radius: 4px; }

.nojs { padding: 1rem; background: var(--bg-surface); }

<body>
<noscript><p class="nojs">This page needs JavaScript to draw the board. Nothing is lost: answer in chat, or by message, in your own words.</p></noscript>
<main id="app"></main>
<script id="vision-data" type="application/json">/*__VISION_DATA__*/</script>

    if (p[0] === "a" || p[0] === "o") return "answer to " + it + ": " + q(v);

    : (owner ? "Mark things here and they are saved for me. Tell me in chat when you are done." : "Mark things here, then press Send for the person who shared this page.") + " Copy still sends the same lines.", head);
  oldMarks(head);

  var turn = el("section", "turn", null, app), tl;
  el("h2", null, "Your turn (" + V.turn.length + ")", turn);
  if (!V.turn.length) el("p", "muted", "Nothing to decide this round. Read it through and tell me what's wrong.", turn);
  tl = el("ol", null, null, turn);
  V.turn.forEach(function (t) { var li = el("li", null, null, tl); li.setAttribute("data-kind", t.kind); el("span", null, t.text + " ", li); jumpTo(li, t.refs); });

  function section(key, name, summary, build) {
    sec = secs[key] = el("details", "sec", null, app);
    sec.setAttribute("data-section", key);
    var s = el("summary", null, null, sec);
    el("h2", null, name, s);
    el("span", "sum", summary, s);
    build(el("div", "body", null, sec));
    sec.open = Boolean(central[key]);
  }
  var count = { first: 0, later: 0, no: 0 }, guesses = 0, nFields = 0;
  B.features.forEach(function (f) { count[f.bucket]++; guesses += f.bucket === "first" && f.source === "guess"; });
  B.screens.forEach(function (s) { nFields += fields(s.wireframe); });
  if (B.heard.length || B.people.length || B.tone.length || B.appetite) section("heard", "What I heard", B.heard.map(function (h) { return h.theme + " ×" + h.quotes.length; }).join(" · "), heard);
  section("dirs", "Directions", B.concepts.length + " directions · " + (B.pick.id ? (owner ? "you picked " : "picked: ") + title(B.pick.id) : "none picked yet"), dirs);
  if (B.screens.length) section("walk", "Try it", B.screens.length + " screens · " + nFields + (nFields === 1 ? " field" : " fields") + " · about " + Math.max(1, Math.round(B.screens.length / 2)) + " min", walk);
  if (B.features.length) section("in", "What's in", "First version " + count.first + " · Later " + count.later + " · No " + count.no + (guesses ? " · " + guesses + " still my guess" : ""), whatsIn);
  section("open", "Open questions", B.open.length ? B.open.length + " open" : "nothing open", openQs);
  section("agree", "Agreement", B.status === "agreed" ? "agreed" : B.status === "draft" ? B.outcome : owner ? done + " of 7 ready" : "not agreed yet", agreement);
  section("look", "The look", F.pick ? title(F.pick) + (F.locked ? ", locked" : ", provisional") : F.tiles.length ? F.tiles.length + " looks to pick from" : "comes right after we agree", look);
  dock();
  if (HOSTED) join();

  function heard(body) {
    var said = [B.tone.length && "How it should feel: " + B.tone.map(q).join(", "), B.appetite && "How much time: " + B.appetite];
    if (said[0] || said[1]) el("p", null, said.filter(Boolean).join(" · "), body);
    B.heard.forEach(function (h, t) {
      var box = el("div", null, null, body);
      el("h3", null, h.theme + " ×" + h.quotes.length, box);
      el("p", "muted", h.episode ? "You told me about a real time this happened." : "No real example yet. Tell me about the last time it happened.", box);
      h.quotes.forEach(function (x, j) {
        var bq = el("blockquote", null, null, box);
        el("p", null, x.text, bq);
        el("cite", null, "round " + x.round + ", " + (x.from === "me" ? "you" : x.from), bq);
        flag(bq, "h:" + t + ":" + j, "That's not what I meant", "What did you mean?");
      });
      field(box, "m:" + t, "Say more", true);
    });
    if (!B.people.length) return;
    el("h3", null, "Who has a say", body);
    var ul = el("ul", null, null, body);
    B.people.forEach(function (p) {
      var me = p.name === "me", li = el("li", null, null, ul);
      el("strong", null, (me ? "You" : p.name) + (p.decides ? " (decides)" : "") + ": ", li);
      el("span", null, "wants " + p.wants + ". What would make " + (me ? "you" : p.name) + " say it failed? " + (p.failsIf || "Not asked yet."), li);
    });
  }

  function dirs(body) {
    el("p", "muted", "Which would you open on Monday? What would you never touch? What would you steal from another? What's missing from all of them?", body);
    var grid = el("div", "grid", null, body);
    B.concepts.forEach(function (c) {
      var card = reg(c.id, el("article", "card", null, grid));
      el("h3", null, c.title, card);
      [[c.yours, "your words"], [c.outside, "outside what you said"], [c.existingTools, "uses what you already have"]].forEach(function (t) { if (t[0]) el("span", "chip", t[1], card); });
      el("p", null, "For: " + c.forWhom, card);
      el("p", null, "When: " + c.moment, card);
      sketch(c.home, el("div", "frame", null, card));
      el("p", "muted", "You'd give up " + c.givesUp + ".", card);
      choice(card, "pick", [[c.id, "Pick this"]], B.pick.id);
      choice(card, "not:" + c.id, [["1", "Not this one"]], "");
      on(function () { card.className = "card" + (cur("pick", B.pick.id) === c.id ? " picked" : ""); });
    });
    var mb = el("div", null, null, body), was = owner && B.pick.miss && el("p", "muted", "So far you said: " + q(B.pick.miss), mb);
    el("p", null, "What will you miss from the others? 'Nothing' is a fine answer.", mb);
    missInput = field(mb, "miss", "What you'd miss", false);
    btn("Nothing", mb).addEventListener("click", function () { marks.miss = "nothing"; changed(); });
    on(function () { mb.hidden = !cur("pick", B.pick.id); if (was) was.hidden = "pick" in marks; });
    field(body, "none", "None of these? Say what's wrong with all of them", true);
  }

  function walk(body) {
    var tabs = el("div", "choices", null, body), stage = el("div", "phone", null, body);
    B.screens.forEach(function (s, i) {
      var w = reg(s.id, el("article", null, null, stage)), nx;
      screens[s.id] = { el: w, tab: btn(i + 1 + ". " + s.title, tabs) };
      screens[s.id].tab.addEventListener("click", function () { walkTo(s.id, true); });
      el("h3", null, s.title, w);
      sketch(s.wireframe, el("div", "frame", null, w));
      nx = el("p", null, null, w);
      s.next.forEach(function (id) { btn("Next: " + title(id), nx).addEventListener("click", function () { walkTo(id, true); }); });
      field(w, "w:" + s.id, "Wrong or missing here?", true);
    });
    back = btn("Back", body);
    back.addEventListener("click", function () { hist.pop(); walkTo(hist.pop(), true); });
    var fine = choice(body, "fine", [["1", ""]], "")[0];
    on(function () { fine.textContent = "Everything I didn't touch is fine (" + untouched() + ")"; });
    walkTo(B.screens[0].id);
  }

  function whatsIn(body) {
    var steps = [], grid = el("div", "grid", null, body);
    B.features.forEach(function (f) { if (steps.indexOf(f.step) === -1) steps.push(f.step); });
    steps.forEach(function (s) {
      var col = el("div", null, null, grid);
      el("h3", null, s, col);
      B.features.forEach(function (f) { if (f.step === s) card(f, col); });
    });
    field(body, "add", "Something missing? Add a card", false);
    function card(f, col) {
      var c = reg(f.id, el("article", "card" + (f.source === "guess" ? " guess" : ""), null, col));
      el("strong", null, f.title, el("p", null, null, c));
      if (f.source) {
        el("span", "chip " + f.source, SOURCE[f.source], c);
        var d = el("details", null, null, c);
        el("summary", null, "Where did this come from?", d);
        el("p", "muted", f.source === "said" ? "You said: " + q(f.quote) : f.source === "picked" ? "It came with what you picked." : "My guess: nobody has said it yet. Keep it, move it or drop it.", d);
      }
      choice(c, "b:" + f.id, [["first", BUCKET.first], ["later", BUCKET.later], ["no", BUCKET.no]], f.bucket);
      if (f.bucket !== "first") return;
      el("p", "muted", "Once it exists, will you need to:", c);
      Object.keys(DO).forEach(function (k) { choice(c, "do:" + f.id + ":" + k, [["1", DO[k]]], ""); });
    }
  }

  function openQs(body) {
    if (!B.open.length) el("p", "muted", "Nothing open right now.", body);
    B.open.forEach(function (o) {
      var c = reg(o.id, el("article", "card", null, body));
      el("span", "chip", KIND[o.kind], c);
      el("p", null, o.text, c);
      if (o.options.length) choice(c, "a:" + o.id, o.options.map(function (x) { return [x, x]; }), "");
      field(c, "o:" + o.id, o.options.length ? "Or in your own words" : "Your answer", false);
      el("p", "muted", o.who === (V.for || "me") ? "You decide." : o.who === "me" ? "The person who shared this page decides." : o.who ? o.who + " decides." : "Not yours alone to decide: who decides?", c);
      if (!o.who) field(c, "who:" + o.id, "Who decides?", false);
    });
  }

  function agreement(body) {
    if (B.status === "agreed") el("p", null, "Agreed in round " + B.round + (owner ? ": you said " + q(A.yes) + " in chat." : "."), body);
    if (B.status === "draft") el("p", null, B.outcome, body);
    if (owner) { // the checks ask things of the owner; a share copy carries none
      el("h3", null, "Before we can agree", body);
      var ul = el("ul", "checks", null, body);
      V.ready.forEach(function (r) {
        var li = el("li", r.ok ? "ok" : null, null, ul);
        li.setAttribute("data-code", r.code);
        el("span", null, (r.ok ? "Done: " : "To do: ") + r.text + " ", li);
        if (!r.ok) jumpTo(li, r.refs);
      });
    }
    if (A.teach) { el("h3", null, "What we're building, in one sentence", body); el("blockquote", null, A.teach, body); }
    var dl = el("dl", null, null, body);
    [["The one flow", A.oneFlow && title(A.oneFlow)], ["Could wait", A.couldWait.map(title).join(", ")],
      ["Would annoy on the first screen", /^none$/i.test(A.annoy.trim()) ? "nothing" : A.annoy && title(A.annoy)]].forEach(function (f) {
      if (f[1]) { el("dt", null, f[0], dl); el("dd", null, f[1], dl); }
    });
    if (A.items.length) {
      el("h3", null, "What we agree on", body);
      var ol = el("ol", null, null, body);
      A.items.forEach(function (t, i) { var li = el("li", null, null, ol); el("span", null, t + " ", li); flag(li, "i:" + i, "Not quite", "What's off?"); });
    }
    el("p", "cant", "This page can't agree for you: say yes in chat.", body);
  }

  function look(body) {
    el("p", null, F.source ? LOOK[F.source] + (F.locked ? " Locked." : " Provisional until you say 'lock it' in chat.") : "The look comes right after we agree: colours, type and a first look at real screens.", body);
    var grid = el("div", "grid", null, body), home = byId[B.pick.id];
    F.tiles.forEach(function (t) {
      var c = reg(t.id, el("article", "card", null, grid)), sw, mini;
      el("h3", null, t.name, c);
      sw = el("div", null, null, c);
      t.swatches.forEach(function (x) {
        if (!/^#[0-9a-f]{6}$/i.test(x)) return;
        var s = el("span", "swatch", null, sw);
        s.style.background = x;
        s.setAttribute("role", "img");
        s.setAttribute("aria-label", x);
      });
      t.fonts.forEach(function (f) { el("p", null, "Aa " + f, c).style.fontFamily = f; });
      mini = el("div", "frame", null, c);
      ["--sk-bg", "--sk-ink", "--sk-accent"].forEach(function (v, i) { if (/^#[0-9a-f]{6}$/i.test(t.swatches[i] || "")) mini.style.setProperty(v, t.swatches[i]); });
      if (t.fonts[0]) mini.style.fontFamily = t.fonts[0];
      if (home) sketch(home.item.home, mini); else mini.hidden = true;
      el("p", "muted", t.note, c);
      choice(c, "tile", [[t.id, "Pick this look"]], F.pick);
      field(c, "tn:" + t.id, "Note on this look", false);
    });
    var protos = V.links.filter(function (l) { return l.kind === "prototype"; });
    if (protos.length) { var p = el("p", null, "First look: ", body); protos.forEach(function (l) { link(l, p); }); }
  }

  function dock() {
    var d = el("aside", "dock", null, app), row = el("div", "row", null, d), who, more, pre, n, go, clear;
    d.setAttribute("aria-label", "Your answer");
    if (owner) { // a share copy fixes the name; here someone else at this screen can type theirs
      who = el("input", null, null, el("label", "field", "Answering as ", row));
      who.value = from;
      if (HOSTED) who.setAttribute("readonly", ""); // the signed-in account is who answers
      else who.addEventListener("input", function () { from = who.value.trim() || "me"; changed(); });
    } else el("span", null, "Answering as: " + V.for, row);
    n = el("span", "muted", null, row);
    sync = el("span", "muted", null, row);
    go = btn("Copy", row, "btn primary");
    bar = { box: d, row: row, copy: go };
    clear = btn("Clear marks", row);
    status = el("p", "muted", null, d);
    status.setAttribute("role", "status");
    manual = el("textarea", "lines", null, d);
    manual.setAttribute("readonly", "");
    manual.setAttribute("aria-label", "Lines to copy");
    manual.hidden = true;
    more = el("details", null, null, d);
    el("summary", null, "Add a note, or see what Copy sends", more);
    field(more, "note", "A note (on its own it changes nothing)", true);
    pre = el("pre", "lines", null, more);
    on(function () { var k = Object.keys(marks).length; n.textContent = k ? k + (k === 1 ? " mark" : " marks") : "No marks yet"; clear.hidden = !k; pre.textContent = block(); });
    go.addEventListener("click", function () {
      if (!Object.keys(marks).length) return say("Nothing marked yet. You can also just answer in chat.");
      if (!missFirst("Copy")) copy(block(), function () { saved.sent = true; save(); });
    });
    clear.addEventListener("click", function () { Object.keys(marks).forEach(function (k) { delete marks[k]; }); changed(); say("Marks cleared."); });
  }
  function say(t) { status.textContent = t; }
  function missFirst(name) { // a new pick waits once, for Copy and Send alike, for what they'd miss
    if (!("pick" in marks) || "miss" in marks || waited) return false;
    waited = true;
    secs.dirs.open = true;
    missInput.focus();
    say("One thing first: what will you miss from the other directions? 'Nothing' is fine. Press " + name + " again to send without it.");
    return true;
  }

  // Clipboard first, then the execCommand fallback, then the lines pre-selected for a manual copy.
  function copy(text, after) {
    function done() { manual.hidden = true; say("Copied. Paste it in chat."); after(); }
    function fallback() {
      var ta = el("textarea", null, null, document.body), copied = false;
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "absolute";
      ta.style.left = "-9999px";
      ta.select();
      try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
      document.body.removeChild(ta);
      if (copied) return done();
      manual.value = text;
      manual.hidden = false;
      manual.focus();
      manual.select();
      say("This browser blocks copying. The lines are selected below: press Ctrl+C (Cmd+C on a Mac), then paste them in chat.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  // Marks from an earlier round's page, not yet sent: shown with their own round, never applied here.
  function oldMarks(parent) {
    var s = store(), pre = "envision:" + B.project + ":";
    try {
      for (var i = s.length - 1; i >= 0; i--) {
        var k = s.key(i), m = k.indexOf(pre) === 0 && /^(\d+)(?::(.+))?$/.exec(k.slice(pre.length)), o = m && load(k);
        if (!o || +m[1] >= B.round || (m[2] || "") !== (V.for || "")) continue;
        if (o.sent) s.removeItem(k); else stale(k, +m[1], o.text);
      }
    } catch (e) { /* no storage, nothing to show */ }
    function stale(k, r, text) {
      var box = el("div", "old", null, parent), drop = function () { try { s.removeItem(k); } catch (e) { /* ignore */ } box.hidden = true; };
      el("p", null, "You marked the round " + r + " page and didn't send it. Those marks are kept apart, because the page has changed since.", box);
      el("pre", "lines", text, box);
      btn("Copy them as they were", box).addEventListener("click", function () { copy(text, drop); });
      btn("Throw them away", box).addEventListener("click", drop);
    }
  }
  // --- Hosted (claude.ai): the same page plus saved marks and Comment buttons ----------------------
  // Each part waits for its capability and does nothing without it, so offline and view-only pages keep the floor:
  // marks in this browser, and Copy. The row is the Copy block, written whole by this page and only this page:
  // the owner's board saves as they mark; a person's page writes nothing until they press Send.
  function join() {
    var C = window.claude;
    function cap(name) { return Promise.resolve().then(function () { return C.use(name); }).then(function (x) { return x || null; }, function () { return null; }); }
    cap("comments").then(function (c) { if (c) { live.notes = c; commentButtons(c); } });
    Promise.all([cap("db"), cap("user")]).then(function (p) {
      if (!p[0] || !p[1]) return liveStop("Marks stay in this browser. Press Copy and send the lines.");
      return Promise.all([p[1].isOwner(), p[1].id()]).then(function (w) { attach(p[0], w[0], w[1]); });
    }).catch(function () { liveStop("Marks stay in this browser. Press Copy and send the lines."); });
  }
  function attach(db, isOwner, uid) {
    if (owner && !isOwner) return lockOut(); // the owner's board seen by someone else
    if (!owner && isOwner) return liveStop("You made this page, so your marks here are a preview and are not saved.");
    if (!(owner ? "owner" : uid)) return liveStop("Marks stay in this browser. Press Copy and send the lines.");
    live.doc = db.doc("marks/" + (owner ? "owner" : uid));
    if (!owner) { bar.copy.className = "btn"; live.send = btn("Send", bar.row, "btn primary"); live.send.addEventListener("click", send); }
    live.doc.onSnapshot(rowSeen, function () { liveStop("Marks can't be saved here. Press Copy and send the lines."); });
  }
  // The first settled read restores marks made on another device; a row from a newer round stops this page writing.
  // This callback never writes: on the owner's board it only schedules the save a change would.
  function rowSeen(snap) {
    var d = snap.exists ? snap.data() : null;
    if (d && d.round > B.round) return liveStop("There is a newer round of this page. Reload it; Copy still sends what you marked here.");
    if (live.seen || (snap.metadata && snap.metadata.fromCache)) return;
    live.seen = true;
    if (d && d.round === B.round && !Object.keys(marks).length) restore(d.marks);
    if (!owner) liveNote("Nothing leaves this page until you press Send.");
    else if (Object.keys(marks).length) push(); else liveNote("Your marks are saved as you make them.");
  }
  // A row is data: only its own keys with text values come back, and "__proto__" is never a mark.
  function restore(m) {
    if (!m || typeof m !== "object") return;
    Object.keys(m).forEach(function (k) { if (k !== "__proto__" && typeof m[k] === "string") marks[k] = m[k]; });
    repaint();
  }
  function row() { return { v: 1, round: B.round, n: Object.keys(marks).length, text: block(), marks: JSON.parse(JSON.stringify(marks)) }; }
  // The owner's board: a burst of marks is one write. A person's page only notes that its marks are not sent yet.
  function push() {
    if (!live.doc || live.off) return;
    if (!owner) return liveNote("Not sent yet: press Send when you are done.");
    live.dirty = true;
    later();
  }
  function later() { if (!live.timer) live.timer = window.setTimeout(flush, 500); }
  function send() {
    if (live.off) return;
    if (!Object.keys(marks).length) return say("Nothing marked yet. You can also just answer in chat.");
    if (missFirst("Send")) return;
    live.dirty = true;
    flush();
  }
  // One write at a time, newest state wins: a mark or a Send made mid-write is written after it.
  function flush() {
    live.timer = 0;
    if (live.busy || live.off || !live.dirty) return;
    var r = row();
    live.busy = true;
    live.dirty = false;
    liveNote(owner ? "Saving…" : "Sending…");
    live.doc.set(r).then(function () {
      live.retried = false;
      if (live.dirty) return; // a newer write follows and reports
      var current = r.text === block();
      if (current) { saved.sent = true; save(); }
      if (owner) return liveNote("Saved. Tell me in chat when you are done.");
      liveNote(current ? "Sent to the person who shared this page." : "Not sent yet: press Send when you are done.");
      told();
    }, function (e) {
      if (e && e.code === "unavailable" && !live.retried) { live.retried = true; live.dirty = true; return; } // once, with the next write
      liveStop(owner ? "Couldn't save your marks. Press Copy and send the lines." : "Couldn't send from here. Press Copy and send the lines by message.");
    }).then(function () { live.busy = false; if (live.dirty) later(); });
  }
  // After a Send the shell's comment box opens on the dock, for a line to the owner; a refusal is fine.
  function told() {
    say("Sent.");
    if (live.notes) Promise.resolve().then(function () { return live.notes.openComposer({ element: bar.box }); }).then(function (x) {
      if (x && x.opened) say("Sent. Add a line for them in the comment box, if you like.");
    }, function () { /* no comment box in this view: nothing to do */ });
  }
  function liveNote(t) { if (sync) sync.textContent = t; }
  function liveStop(t) {
    live.off = true;
    if (live.timer) window.clearTimeout(live.timer);
    live.timer = 0;
    if (live.send) { live.send.hidden = true; bar.copy.className = "btn primary"; }
    liveNote(t);
  }
  function lockOut() { liveStop(""); app.textContent = ""; el("p", "nojs", "This page belongs to the person who made it.", app); }
  function commentButtons(c) {
    Object.keys(byId).forEach(function (id) {
      var x = byId[id];
      if (x.el) btn("Comment", x.el).addEventListener("click", function () {
        Promise.resolve().then(function () { return c.openComposer({ element: x.el }); }).catch(function () { /* no composer in this view: nothing to do */ });
      });
    });
  }
}());
